name: Sorteos a Telegram

on:
  schedule:
    - cron: '31 13 * * 1-6'
    - cron: '36 15 * * *'
    - cron: '31 18 * * *'
    - cron: '1 23 * * 1-6'
    - cron: '31 1 * * 2-6'
    - cron: '31 1 * * 0'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enviar resultados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python enviar_sorteos.py --auto --espera 25
