name: Sorteos a Telegram

on:
  schedule:
    # Corridas principales: apenas pasa el horario de cada sorteo.
    - cron: '31 13 * * 1-6'
    - cron: '36 15 * * *'
    - cron: '31 18 * * *'
    - cron: '1 23 * * 1-6'
    - cron: '31 1 * * 2-6'
    - cron: '31 1 * * 0'
    # Corridas de refuerzo: unos 40 minutos despues, por si el sitio se atrasa.
    - cron: '10 14 * * 1-6'
    - cron: '10 16 * * *'
    - cron: '10 19 * * *'
    - cron: '40 23 * * 1-6'
    - cron: '10 2 * * 2-6'
    - cron: '10 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enviar resultados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python enviar_sorteos.py --auto
      - name: Guardar estado
        if: always()
        run: |
          git config user.name bot-sorteos
          git config user.email bot@users.noreply.github.com
          git add .estado.json || true
          git commit -m "estado sorteos" || true
          git push || true
