name: Sorteos a Telegram

on:
  schedule:
    # 10:20 La Previa (arranca antes del sorteo)
    - cron: '20 13 * * 1-6'
    # 10:40 La Previa
    - cron: '40 13 * * 1-6'
    # 11:00 La Previa
    - cron: '0 14 * * 1-6'
    # 11:20 La Previa
    - cron: '20 14 * * 1-6'
    # 11:40 cierre La Previa
    - cron: '40 14 * * 1-6'
    # 12:25 Matutina (arranca antes del sorteo)
    - cron: '25 15 * * *'
    # 12:45 Matutina
    - cron: '45 15 * * *'
    # 13:05 Matutina
    - cron: '5 16 * * *'
    # 13:25 Matutina
    - cron: '25 16 * * *'
    # 13:45 cierre Matutina
    - cron: '45 16 * * *'
    # 15:20 Vespertina (arranca antes del sorteo)
    - cron: '20 18 * * *'
    # 15:40 Vespertina
    - cron: '40 18 * * *'
    # 16:00 Vespertina
    - cron: '0 19 * * *'
    # 16:20 Vespertina
    - cron: '20 19 * * *'
    # 16:40 cierre Vespertina
    - cron: '40 19 * * *'
    # 17:20 barrido
    - cron: '20 20 * * *'
    # 18:30 barrido
    - cron: '30 21 * * *'
    # 19:50 Tardecita (arranca antes del sorteo)
    - cron: '50 22 * * 1-6'
    # 20:10 Tardecita
    - cron: '10 23 * * 1-6'
    # 20:30 Tardecita
    - cron: '30 23 * * 1-6'
    # 20:50 Tardecita
    - cron: '50 23 * * 1-6'
    # 21:10 cierre Tardecita (lun a vie)
    - cron: '10 0 * * 2-6'
    # 21:10 cierre Tardecita (sab)
    - cron: '10 0 * * 0'
    # 22:20 Nocturna (arranca antes del sorteo)
    - cron: '20 1 * * 2-6'
    # 22:20 Nocturna (sabado)
    - cron: '20 1 * * 0'
    # 22:40 Nocturna
    - cron: '40 1 * * 2-6'
    # 22:40 Nocturna (sabado)
    - cron: '40 1 * * 0'
    # 23:00 Nocturna
    - cron: '0 2 * * 2-6'
    # 23:00 Nocturna (sabado)
    - cron: '0 2 * * 0'
    # 23:20 Nocturna
    - cron: '20 2 * * 2-6'
    # 23:20 Nocturna (sabado)
    - cron: '20 2 * * 0'
    # 23:40 cierre Nocturna (lun a vie)
    - cron: '40 2 * * 2-6'
    # 23:40 cierre Nocturna (sabado)
    - cron: '40 2 * * 0'
    # 23:55 cierre del dia
    - cron: '55 2 * * *'
  workflow_dispatch:

# Evita que dos corridas se pisen entre si (GitHub a veces las encima).
concurrency:
  group: sorteos-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    # Tope de 20 min: si una corrida se traba, suelta el candado y libera a la siguiente.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enviar resultados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo '=== BOT V6 (autocontenido) ==='
          cat > bot.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          """
          Envia los resultados de los sorteos de Caja Social de Santiago del Estero
          directo a Telegram. Pensado para correr en GitHub Actions: no depende de
          ninguna computadora prendida.

          Uso:
              python enviar_sorteos.py --auto
              python enviar_sorteos.py --solo "Matutina"
              python enviar_sorteos.py --resumen
              python enviar_sorteos.py --probar

          Variables de entorno (se cargan como Secrets en GitHub):
              TELEGRAM_TOKEN     token del bot
              TELEGRAM_CHAT_ID   chat id de destino

          Como funciona --auto (lo que usa GitHub Actions):
          - Cada sorteo tiene DOS corridas programadas: una "principal" (apenas pasa el
            horario del sorteo) y una de "refuerzo" 40 minutos despues.
          - La principal espera hasta 25 minutos a que el sitio publique. Si no aparece,
            termina SIN error: ya lo va a intentar el refuerzo.
          - El refuerzo espera hasta 50 minutos mas y, si tampoco aparece, ahi si falla
            (para que GitHub avise por correo).
          - A las 23:45 hay una corrida de "cierre" que manda cualquier sorteo del dia que
            todavia no se haya enviado, por si las dos anteriores fallaron.
          - Ninguna manda dos veces lo mismo: queda registrado en .estado.json.
          - Ademas solo acepta resultados con la fecha de HOY, asi nunca se manda por
            error un sorteo del dia anterior.

          No usa librerias externas: solo la biblioteca estandar de Python.
          """

          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "http://www.cajasocialsde.gob.ar"
          URL_SORTEOS_HOY = BASE + "/php/sorteosHoy.php"
          URL_HOME = BASE + "/"

          NOMBRES_SORTEO = {
              "PV": "La Previa",
              "M": "Matutina",
              "V": "Vespertina",
              "E": "Tardecita",
              "N": "Nocturna",
              "DM": "Matutina",
              "DV": "Vespertina",
          }

          # Sorteos que NO se juegan los domingos.
          NO_HAY_DOMINGO = ["La Previa", "Tardecita", "Nocturna"]

          ORDEN = ["La Previa", "Matutina", "Vespertina", "Tardecita", "Nocturna"]

          EMOJI = {
              "La Previa": "\U0001F305",
              "Matutina": "\U0001F31E",
              "Vespertina": "\U0001F307",
              "Tardecita": "\U0001F306",
              "Nocturna": "\U0001F319",
          }

          CIERRE = (
              "\u00bfSaliste premiado? Pasate por Agencia 617 y cobr\u00e1 tu premio al instante.\n"
              "\n\u00bfNo pod\u00e9s llegar? \u00a1No importa! Pasanos tu alias y te transferimos tu premio.\n"
              "\n\u00bfQuer\u00e9s jugar? Mandanos tus jugadas al WhatsApp 3854780044 "
              "y pag\u00e1s con transferencia.\n"
              "\n\u00bfNo sab\u00e9s qu\u00e9 n\u00fameros jugar? Escribinos y te pasamos los atrasados "
              "y los peligrosos."
          )

          CIERRE_CORTO = (
              "\u00bfSaliste premiado? Pasate por Agencia 617 y cobr\u00e1 al instante.\n"
              "\u00bfNo pod\u00e9s llegar? Pasanos tu alias y te transferimos.\n"
              "Jugadas por WhatsApp 3854780044"
          )

          HASHTAGS = "#quiniela #t\u00f3mbola #resultados #santiagodelestero #agencia617"

          # Argentina es UTC-3 fijo (no cambia con el horario de verano).
          TZ_ARG = datetime.timezone(datetime.timedelta(hours=-3))

          # Minutos que espera una corrida a que se publique el sorteo que espera.
          ESPERA = 15

          # Cada cuantos segundos consulta la pagina mientras espera.
          # Bajo de 60 a 20: asi el aviso sale apenas la pagina carga el resultado,
          # y no hasta un minuto despues.
          INTERVALO = 20

          # Hora aproximada de cada sorteo (minutos desde la medianoche, hora Argentina).
          # Solo se usa para avisar si un sorteo del dia no se llego a mandar.
          HORA_SORTEO_ARG = {
              "La Previa": 10 * 60 + 30,
              "Matutina": 12 * 60 + 35,
              "Vespertina": 15 * 60 + 30,
              "Tardecita": 20 * 60,
              "Nocturna": 22 * 60 + 30,
          }

          ESTADO_PATH = os.path.join(
              os.path.dirname(os.path.abspath(__file__)), ".estado.json"
          )


          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read().decode("utf-8", errors="replace")


          def parse_tombola(html):
              sorteos = []
              bloques = re.findall(
                  r"<div class=['\"]card-sorteo['\"].*?</table>", html, re.DOTALL
              )
              for bloque in bloques:
                  m_tipo = re.search(r"var tipoext\s*=\s*'([A-Z]+)'", bloque)
                  m_fecha = re.search(r"<li>\s*(\d{2}/\d{2}/\d{4})", bloque)
                  m_contenido = re.search(
                      r"contenido-extracto['\"]>(.*?)</div>", bloque, re.DOTALL
                  )
                  cabeza = ""
                  if m_contenido:
                      lis = re.findall(r"<li>(.*?)</li>", m_contenido.group(1), re.DOTALL)
                      lis = [re.sub(r"<[^>]+>", "", x).strip() for x in lis]
                      if len(lis) >= 2:
                          cabeza = lis[1]
                  numeros = [
                      n.strip()
                      for n in re.findall(r"<span[^>]*>\s*([0-9]{3,5})\s*</span>", bloque)
                  ]
                  if not numeros:
                      continue
                  tipo = m_tipo.group(1) if m_tipo else ""
                  sorteos.append(
                      {
                          "tipo": tipo,
                          "nombre": NOMBRES_SORTEO.get(tipo, tipo or "Sorteo"),
                          "fecha": m_fecha.group(1) if m_fecha else "",
                          "cabeza": cabeza,
                          "numeros": numeros,
                      }
                  )
              sorteos.sort(
                  key=lambda s: ORDEN.index(s["nombre"]) if s["nombre"] in ORDEN else 99
              )
              return sorteos


          def parse_loteria(html):
              m_fecha = re.search(r"extractosFecha['\"]>(\d{2}/\d{2}/\d{4})", html)
              m_cabeza = re.search(r"cabeceral['\"]>\s*([0-9]+)", html)
              if not m_fecha:
                  return None
              columnas = ["primeraColumna", "segundaColumna", "terceraColumna", "cuartaColumna"]
              filas = ["primeraFila", "segundaFila", "terceraFila", "cuartaFila", "ultimaFila"]
              numeros = []
              for fila in filas:
                  for col in columnas:
                      patron = r"class\s*=\s*['\"][^'\"]*%s[^'\"]*%s[^'\"]*['\"]>\s*([0-9]{5})" % (
                          col,
                          fila,
                      )
                      m = re.search(patron, html)
                      numeros.append(m.group(1) if m else "")
              return {
                  "fecha": m_fecha.group(1),
                  "cabeza": m_cabeza.group(1) if m_cabeza else "",
                  "numeros": numeros,
              }


          def numeros_en_linea(numeros, por_linea=4):
              partes = []
              linea = []
              for i, n in enumerate(numeros[:20], start=1):
                  linea.append("%d\u00b0 %s" % (i, n))
                  if len(linea) == por_linea:
                      partes.append(" | ".join(linea))
                      linea = []
              if linea:
                  partes.append(" | ".join(linea))
              return "\n".join(partes)


          def generar_post_sorteo(s):
              em = EMOJI.get(s["nombre"], "\U0001F3AF")
              lineas = [
                  "%s RESULTADOS %s" % (em, s["nombre"].upper()),
                  "\U0001F4C5 %s" % s["fecha"],
                  "",
                  "\U0001F3B0 T\u00d3MBOLA",
              ]
              if s["cabeza"]:
                  lineas.append("Cabeza / lote: %s" % s["cabeza"])
              lineas.append("")
              lineas.append(numeros_en_linea(s["numeros"], 4))
              lineas.append("")
              lineas.append(CIERRE)
              lineas.append("")
              lineas.append(HASHTAGS)
              return "\n".join(lineas)


          def generar_resumen_dia(sorteos, loteria):
              titulo = sorteos[0]["fecha"] if sorteos else ""
              lineas = ["\U0001F3AF RESULTADOS DEL D\u00cdA - %s" % titulo, ""]
              for s in sorteos:
                  em = EMOJI.get(s["nombre"], "\U0001F3AF")
                  lineas.append("%s %s (%s)" % (em, s["nombre"].upper(), s["fecha"]))
                  if s["cabeza"]:
                      lineas.append("Cabeza / lote: %s" % s["cabeza"])
                  lineas.append(numeros_en_linea(s["numeros"], 4))
                  lineas.append("")
              if loteria:
                  lineas.append("\U0001F3AB LOTER\u00cdA SANTIAGUE\u00d1A (%s)" % loteria["fecha"])
                  lineas.append("Cabeza: %s" % loteria["cabeza"])
                  lineas.append(numeros_en_linea(loteria["numeros"], 4))
                  lineas.append("")
              lineas.append(CIERRE_CORTO)
              lineas.append("")
              lineas.append(HASHTAGS)
              return "\n".join(lineas)


          def mostrar_config():
              """Imprime en el registro si las claves llegaron (sin mostrar el valor)."""
              token = (os.environ.get("TELEGRAM_TOKEN") or "").strip()
              chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
              print(
                  "Config -> TELEGRAM_TOKEN: %s | TELEGRAM_CHAT_ID: %s | evento: %s"
                  % (
                      "cargado (%d caracteres)" % len(token) if token else "FALTA",
                      "'%s'" % chat_id if chat_id else "FALTA",
                      os.environ.get("GITHUB_EVENT_NAME") or "(corrida local)",
                  )
              )


          def enviar_telegram(texto):
              token = (os.environ.get("TELEGRAM_TOKEN") or "").strip()
              chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
              if not token or not chat_id:
                  raise SystemExit(
                      "Faltan TELEGRAM_TOKEN o TELEGRAM_CHAT_ID. "
                      "Cargalos como Secrets en el repositorio."
                  )
              url = "https://api.telegram.org/bot%s/sendMessage" % token
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": texto}).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      r = resp.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  cuerpo = ""
                  try:
                      cuerpo = e.read().decode("utf-8", "replace")
                  except Exception:
                      pass
                  raise SystemExit(
                      "Telegram devolvio el error %s. Revisa el token y el chat id en los "
                      "Secrets del repositorio. Respuesta de Telegram: %s"
                      % (e.code, cuerpo[:300])
                  )
              except Exception as e:
                  raise SystemExit("No pude conectar con Telegram: %s" % e)
              if '"ok":false' in r.replace(" ", ""):
                  raise SystemExit("Telegram rechazo el mensaje: %s" % r)
              return True


          # ---------------------------------------------------------------- estado ----
          # Guarda que sorteos ya se mandaron, para no repetir entre la corrida
          # principal y la de refuerzo.


          def cargar_estado():
              try:
                  with open(ESTADO_PATH, "r", encoding="utf-8") as f:
                      datos = json.load(f)
                  if isinstance(datos, dict):
                      return datos
              except Exception:
                  pass
              return {}


          def guardar_estado(estado):
              # Se quedan solo los ultimos 10 dias para que el archivo no crezca.
              for fecha in sorted(estado)[:-10]:
                  estado.pop(fecha, None)
              try:
                  with open(ESTADO_PATH, "w", encoding="utf-8") as f:
                      json.dump(estado, f, ensure_ascii=False, indent=1)
              except Exception as e:
                  print("Aviso: no pude guardar el estado (%s)" % e)


          def ya_enviado(fecha, nombre):
              return nombre in cargar_estado().get(fecha, [])


          def marcar_enviado(fecha, nombre):
              estado = cargar_estado()
              estado.setdefault(fecha, [])
              if nombre not in estado[fecha]:
                  estado[fecha].append(nombre)
              guardar_estado(estado)


          # ------------------------------------------------------------ fecha y hora --


          def ahora_arg():
              return datetime.datetime.now(datetime.timezone.utc).astimezone(TZ_ARG)


          def fecha_arg():
              return ahora_arg().strftime("%d/%m/%Y")


          def elegir(sorteos, nombre, fecha):
              """Devuelve el sorteo que coincida en nombre Y en fecha."""
              for s in sorteos:
                  if s["nombre"].lower() == nombre.lower() and s["fecha"] == fecha:
                      return s
              return None


          # Horarios de cada sorteo en minutos UTC desde la medianoche.
          #   01:30 UTC = 22:30 Arg (Nocturna) | 13:30 = 10:30 (Previa)
          #   15:35 = 12:35 (Matutina) | 18:30 = 15:30 (Vespertina) | 23:00 = 20:00 (Tardecita)
          SLOTS_UTC = [
              (90, "Nocturna"),
              (810, "La Previa"),
              (935, "Matutina"),
              (1110, "Vespertina"),
              (1380, "Tardecita"),
          ]


          def sorteo_por_reloj():
              """Deduce que sorteo corresponde segun la hora UTC actual."""
              ahora = datetime.datetime.now(datetime.timezone.utc)
              minuto = ahora.hour * 60 + ahora.minute
              mejor = None
              for slot, nombre in SLOTS_UTC:
                  distancia = abs(minuto - slot)
                  distancia = min(distancia, 1440 - distancia)
                  if mejor is None or distancia < mejor[0]:
                      mejor = (distancia, nombre)
              return mejor[1], mejor[0]


          def esperar_sorteo(nombre, fecha, minutos, estricto=True):
              """Consulta la pagina hasta que aparezca el sorteo pedido con la fecha de hoy."""
              limite = int(time.time()) + minutos * 60
              intento = 0
              while True:
                  intento += 1
                  sorteos = []
                  try:
                      sorteos = parse_tombola(fetch(URL_SORTEOS_HOY))
                  except Exception as e:
                      print("Intento %d: no pude leer la pagina (%s)" % (intento, e))
                  s = elegir(sorteos, nombre, fecha)
                  if s:
                      print("Encontrado: %s (%s)" % (s["nombre"], s["fecha"]))
                      return s
                  if time.time() >= limite:
                      disponibles = (
                          ", ".join("%s %s" % (x["nombre"], x["fecha"]) for x in sorteos)
                          or "(ninguno)"
                      )
                      mensaje = (
                          "El sorteo '%s' con fecha %s no aparecio despues de %d minutos. "
                          "Sorteos publicados: %s" % (nombre, fecha, minutos, disponibles)
                      )
                      if estricto:
                          raise SystemExit(mensaje)
                      print(mensaje)
                      print("No marco error: ya lo intenta la corrida de refuerzo.")
                      return None
                  print(
                      "Intento %d: todavia no esta '%s' del %s. Espero 60s..."
                      % (intento, nombre, fecha)
                  )
                  time.sleep(60)


          def main():
              args = sys.argv[1:]
              mostrar_config()

              if "--probar" in args:
                  enviar_telegram(
                      "\u2705 Bot de sorteos funcionando desde la nube.\n"
                      "De aca en mas te llegan los resultados sin depender de ninguna PC."
                  )
                  print("Mensaje de prueba enviado.")
                  return

              if "--resumen" in args:
                  enviar_resumen()
                  return

              if "--auto" in args:
                  ahora = ahora_arg()
                  nombre, distancia = sorteo_por_reloj()
                  print("Hora Argentina: %s" % ahora.strftime("%d/%m/%Y %H:%M"))
                  print("Sorteo segun el reloj: %s (a %d min del horario)" % (nombre, distancia))

                  manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

                  # Si lo corrimos a mano, mando el resumen de lo que ya salio hoy.
                  if manual and distancia > 25:
                      print("Corrida manual: mando el resumen de lo publicado hoy.")
                      return enviar_resumen()

                  # GitHub atrasa las programadas hasta horas. Por eso la corrida ya no
                  # "espera el sorteo que le tocaba": mira la pagina y manda al instante
                  # TODO lo que haya sin enviar, sea cual sea el horario.
                  #
                  # Si no hay nada nuevo, se queda consultando cada INTERVALO segundos
                  # dentro de una ventana de minutos. Asi, en cuanto la pagina carga el
                  # resultado, sale el aviso (en lugar de esperar a la corrida siguiente).
                  if "--espera" in args:
                      minutos = int(args[args.index("--espera") + 1])
                  elif distancia > 60:
                      minutos = 0  # barrido: manda lo que haya, sin quedarse esperando
                  else:
                      minutos = ESPERA

                  # Domingo y el sorteo no se juega: no tiene sentido esperarlo.
                  if ahora.weekday() == 6 and nombre in NO_HAY_DOMINGO:
                      print("Domingo: '%s' no se juega. No espero." % nombre)
                      minutos = 0

                  print("Ventana de espera: hasta %d min (consulta cada %ds)."
                        % (minutos, INTERVALO))
                  sorteos = esperar_y_enviar(nombre, minutos)
                  avisar_faltantes(sorteos)
                  return

              if "--pendientes" in args:
                  enviar_pendientes()
                  return

              if "--solo" in args:
                  nombre = args[args.index("--solo") + 1]
                  minutos = 10
                  if "--espera" in args:
                      minutos = int(args[args.index("--espera") + 1])
                  fecha = args[args.index("--solo") + 2] if len(args) > args.index("--solo") + 2 else fecha_arg()
                  if "--forzar" not in args and ya_enviado(fecha, nombre):
                      print("'%s' del %s ya se envio antes. Usa --forzar para repetirlo." % (nombre, fecha))
                      return
                  s = esperar_sorteo(nombre, fecha, minutos, estricto=True)
                  if not s:
                      return
                  enviar_telegram(generar_post_sorteo(s))
                  marcar_enviado(fecha, s["nombre"])
                  print("Enviado: %s del %s" % (s["nombre"], s["fecha"]))
                  return

              print(__doc__)


          def enviar_resumen():
              sorteos = parse_tombola(fetch(URL_SORTEOS_HOY))
              if not sorteos:
                  # No es un error: simplemente todavia no publicaron nada hoy (por ejemplo
                  # si corriste el bot a mano de madrugada). Aviso por Telegram y listo.
                  aviso = (
                      "\u23f0 Todav\u00eda no hay sorteos publicados para hoy (%s).\n"
                      "En cuanto salga el primero te lo mando ac\u00e1 mismo." % fecha_arg()
                  )
                  enviar_telegram(aviso)
                  print("Aviso enviado: todavia no hay sorteos publicados.")
                  return
              try:
                  loteria = parse_loteria(fetch(URL_HOME))
              except Exception as e:
                  print("Aviso: no pude leer la loteria (%s)" % e)
                  loteria = None
              enviar_telegram(generar_resumen_dia(sorteos, loteria))
              print("Resumen enviado con %d sorteo(s)." % len(sorteos))


          def traer_sorteos():
              """Devuelve los sorteos publicados hoy (o lista vacia si algo falla)."""
              try:
                  return parse_tombola(fetch(URL_SORTEOS_HOY))
              except Exception as e:
                  print("No pude leer la pagina: %s" % e)
                  return []


          def enviar_pendientes():
              """Manda los sorteos de hoy que todavia no se enviaron. Devuelve lo publicado."""
              hoy = fecha_arg()
              sorteos = traer_sorteos()
              if not sorteos:
                  print("Todavia no hay sorteos publicados.")
                  return sorteos
              enviados = cargar_estado().get(hoy, [])
              # Solo sorteos con la fecha de hoy: si la pagina quedo desactualizada,
              # mejor no mandar nada antes que mandar un resultado del dia anterior.
              faltan = [s for s in sorteos if s["fecha"] == hoy and s["nombre"] not in enviados]
              if not faltan:
                  print("No falta ningun sorteo del %s. Listo." % hoy)
                  return sorteos
              print("Faltan %d: %s" % (len(faltan), ", ".join(s["nombre"] for s in faltan)))
              for s in faltan:
                  enviar_telegram(generar_post_sorteo(s))
                  marcar_enviado(hoy, s["nombre"])
                  print("Enviado: %s del %s" % (s["nombre"], s["fecha"]))
              return sorteos


          def esperar_y_enviar(nombre, minutos):
              """Espera a que aparezca algo nuevo y manda todo lo que falte del dia.

              La espera termina en cuanto: aparece un sorteo sin enviar, el sorteo que
              tocaba ya se envio, o se acaban los minutos.
              """
              hoy = fecha_arg()
              limite = time.time() + minutos * 60
              intento = 0
              while True:
                  intento += 1
                  sorteos = traer_sorteos()
                  enviados = cargar_estado().get(hoy, [])
                  if nombre and nombre in enviados:
                      print("'%s' ya se envio hoy. No sigo esperando." % nombre)
                      break
                  if any(s["nombre"] not in enviados for s in sorteos):
                      print("Hay sorteos nuevos sin enviar. Mando.")
                      break
                  if time.time() >= limite:
                      print("Se acabo la espera de %d minutos." % minutos)
                      break
                  print(
                      "Intento %d: consultando la pagina (cada %ds)..." % (intento, INTERVALO)
                  )
                  time.sleep(INTERVALO)
              return enviar_pendientes()


          def avisar_faltantes(sorteos):
              """A la noche avisa si hubo sorteos del dia que no se pudieron mandar."""
              if not sorteos:
                  return
              ahora = ahora_arg()
              minuto = ahora.hour * 60 + ahora.minute
              if minuto < 23 * 60:  # solo avisa despues de las 23 hs
                  return
              publicados = set(s["nombre"] for s in sorteos)
              enviados = set(cargar_estado().get(fecha_arg(), []))
              esperados = ["Matutina", "Vespertina"] if ahora.weekday() == 6 else ORDEN
              faltan = []
              for n in esperados:
                  if n in publicados or n in enviados:
                      continue
                  if minuto > HORA_SORTEO_ARG.get(n, 0) + 90:
                      faltan.append(n)
              if not faltan:
                  return
              enviar_telegram(
                  "\u26a0\ufe0f Aviso: hoy no se pudieron enviar estos sorteos: %s.\n"
                  "Puede que la pagina no los haya publicado." % ", ".join(faltan)
              )
              print("Aviso enviado por: %s" % ", ".join(faltan))


          if __name__ == "__main__":
              main()
          PYEOF
